services:
  - type: web
    name: payment-by-tosspayments
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TOSS_SECRET_KEY
        sync: false
      - key: TOSS_WEBHOOK_SECRET
        sync: false
